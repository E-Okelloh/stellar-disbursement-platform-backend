databases:
  - name: sdp-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: sdp-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    dockerCommand: ./stellar-disbursement-platform serve
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sdp-db
          property: connectionString
      - key: PORT
        value: "8000"
      - key: ADMIN_PORT
        value: "8003"
      - key: METRICS_PORT
        value: "8002"
      - key: LOG_LEVEL
        value: INFO
      - key: INSTANCE_NAME
        value: SDP Backend

      # --- URLs / network: fill these in for your deployment ---
      - key: BASE_URL
        sync: false
      - key: SDP_UI_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: MAX_BASE_FEE
        value: "100"

      # --- Auth / signing secrets: fill these in via the Render dashboard ---
      - key: EC256_PRIVATE_KEY
        sync: false
      - key: SEP10_SIGNING_PUBLIC_KEY
        sync: false
      - key: SEP10_SIGNING_PRIVATE_KEY
        sync: false
      - key: DISTRIBUTION_SEED
        sync: false
      - key: DISTRIBUTION_ACCOUNT_ENCRYPTION_PASSPHRASE
        generateValue: true
      - key: SEP24_JWT_SECRET
        generateValue: true

      # --- Admin API ---
      - key: ADMIN_ACCOUNT
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true

      # --- Misc app config ---
      - key: RESET_TOKEN_EXPIRATION_HOURS
        value: "24"
      - key: MAX_INVITATION_RESEND_ATTEMPTS
        value: "3"
